name: Sync and Build Surge Rules

on:
  workflow_dispatch:
  schedule:
    - cron: '37 */6 * * *'
  push:
    branches:
      - main
    paths:
      - 'config/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/sync-rules.yml'

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: surge-rule-hub-pages
  cancel-in-progress: true

jobs:
  build:
    name: Sync rules and build Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Force workspace to latest origin/main
        shell: bash
        run: |
          set -euo pipefail
          echo "Workflow V11: pinned-builder restore"
          echo "Event SHA: $GITHUB_SHA"
          git fetch --prune origin main
          git checkout -B main origin/main
          git reset --hard origin/main
          CHECKED_SHA="$(git rev-parse HEAD)"
          REMOTE_SHA="$(git rev-parse origin/main)"
          echo "Checked-out SHA: $CHECKED_SHA"
          echo "origin/main SHA: $REMOTE_SHA"
          test "$CHECKED_SHA" = "$REMOTE_SHA"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

