name: Sync and Build Surge Rules

on:
  workflow_dispatch:
  schedule:
    - cron: '37 */6 * * *'
  push:
    branches:
      - main
      - master
    paths:
      - 'config/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/sync-rules.yml'

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: surge-rule-hub-pages
  cancel-in-progress: false

jobs:
  build:
    name: Sync rules and build Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Show pipeline revision
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Commit: $GITHUB_SHA"
          echo "Workflow: .github/workflows/sync-rules.yml"
          grep -n "PIPELINE_VERSION" scripts/build.py || true
          sha256sum scripts/build.py scripts/readme_sync.py scripts/verify.py

      - name: Run parser and README tests
        run: python3 -m unittest discover -s tests -v

      - name: Build canonical Surge outputs
        env:
          PUBLIC_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          python3 scripts/build.py

          echo "--- canonical artifact check ---"
          if [ ! -s dist/RuleSnippet.conf ]; then
            echo "::error title=Canonical Surge snippet missing::scripts/build.py exited successfully but dist/RuleSnippet.conf is missing or empty. This normally means repository files from different package versions were mixed."
            echo "PWD=$PWD"
            echo "Generated directories:"
            ls -la dist docs rules mirror 2>/dev/null || true
            echo "Nearby files:"
            find . -maxdepth 3 -type f | sort | sed -n '1,260p'
            exit 1
          fi

          if ! grep -q '^\[Rule\]$' dist/RuleSnippet.conf; then
            echo "::error title=Invalid canonical Surge snippet::dist/RuleSnippet.conf exists but has no [Rule] header."
            sed -n '1,80p' dist/RuleSnippet.conf || true
            exit 1
          fi

          echo "Canonical snippet generated successfully:"
          wc -l -c dist/RuleSnippet.conf
          sed -n '1,24p' dist/RuleSnippet.conf

      - name: Sync README from canonical RuleSnippet.conf
        run: |
          set -euo pipefail
          python3 scripts/readme_sync.py
          test -s README.md

      - name: Verify generated rules
        run: python3 scripts/verify.py

      - name: Commit last-known-good mirrors and generated output
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- .
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync upstream rules"
            git push
          else
            echo "No generated changes to commit."
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
