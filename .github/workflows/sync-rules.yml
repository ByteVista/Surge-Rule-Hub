name: Sync and Build Surge Rules

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'config/**'
      - 'scripts/**'
      - '.github/workflows/sync-rules.yml'
  schedule:
    - cron: '37 */6 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Mirror, convert, merge and split
        run: |
          export PUBLIC_BASE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          python3 scripts/build.py

      - name: Verify generated rules
        run: python3 scripts/verify.py

      - name: Commit last-known-good mirrors and generated output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mirror rules dist docs
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync upstream rules"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
