          expected = '11d3215442a563bac17dbd54eff528a40368ea08c09c391f36971d55c31297a6'
          actual = hashlib.sha256(builder).hexdigest()
          if actual != expected:
              raise SystemExit(f'Pinned builder checksum mismatch: {actual}')
          Path('scripts/canonical_build.py').write_bytes(builder)
          print(f'Restored scripts/canonical_build.py: {len(builder)} bytes; sha256={actual}')
          if Path('scripts/select.py').exists():
              raise SystemExit('scripts/select.py shadows the Python standard library; rename it to select_source.py')
          PY

      - name: Show pipeline revision
        shell: bash
        run: |
          set -euo pipefail
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Event SHA: $GITHUB_SHA"
          echo "Actual checkout SHA: $(git rev-parse HEAD)"
          echo "Workflow: .github/workflows/sync-rules.yml (V11 pinned-builder restore)"
          sha256sum scripts/canonical_build.py scripts/select_source.py scripts/readme_sync.py scripts/verify.py
          sed -n '1,35p' scripts/canonical_build.py

      - name: Verify canonical builder identity
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 scripts/canonical_build.py --version)"
          echo "Builder: $VERSION"
          if [ "$VERSION" != "surge-rule-hub v9 canonical-builder" ]; then
            echo "::error title=Wrong canonical builder::The latest origin/main does not contain the verified canonical builder."
            echo "Actual file SHA256: $(sha256sum scripts/canonical_build.py | awk '{print $1}')"
            echo "First 80 lines:"
            sed -n '1,80p' scripts/canonical_build.py
            exit 1
          fi
          if [ -e scripts/build.py ]; then
            echo "::error title=Legacy scripts/build.py must be removed::V11 no longer uses scripts/build.py."
            exit 1
          fi
          if cmp -s scripts/canonical_build.py scripts/select_source.py; then
            echo "::error title=canonical_build.py is select_source.py::The canonical builder and selector are identical."
            exit 1
          fi
          grep -q "SURGE_RULE_HUB_CANONICAL_BUILDER_V9" scripts/canonical_build.py
          python3 -m py_compile scripts/canonical_build.py scripts/select_source.py scripts/readme_sync.py scripts/verify.py

      - name: Run parser and README tests
        run: python3 -m unittest discover -s tests -v

      - name: Build canonical Surge outputs
        env:
          PUBLIC_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -u scripts/canonical_build.py

          echo "--- canonical artifact check ---"
          if [ ! -s dist/RuleSnippet.conf ]; then
            echo "::error title=Canonical Surge snippet missing::canonical_build.py exited successfully but dist/RuleSnippet.conf is missing or empty."
            echo "PWD=$PWD"
            ls -la dist docs rules mirror 2>/dev/null || true
            find . -maxdepth 3 -type f | sort | sed -n '1,260p'
            exit 1
          fi

          if ! grep -q '^\[Rule\]$' dist/RuleSnippet.conf; then
            echo "::error title=Invalid canonical Surge snippet::dist/RuleSnippet.conf has no [Rule] header."
            sed -n '1,80p' dist/RuleSnippet.conf || true
            exit 1
          fi

          echo "Canonical snippet generated successfully:"
          wc -l -c dist/RuleSnippet.conf
          sed -n '1,24p' dist/RuleSnippet.conf

      - name: Sync README from canonical RuleSnippet.conf
        run: |
          set -euo pipefail
          python3 scripts/readme_sync.py
          test -s README.md

      - name: Verify generated rules
        run: python3 scripts/verify.py

      - name: Commit generated outputs safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Never let a queued/stale job overwrite a newer main commit.
          BASE_SHA="$(git rev-parse HEAD)"
          git fetch origin main
          REMOTE_SHA="$(git rev-parse origin/main)"
          echo "Build base SHA: $BASE_SHA"
          echo "Current origin/main SHA: $REMOTE_SHA"
          if [ "$BASE_SHA" != "$REMOTE_SHA" ]; then
            echo "::error title=main changed during build::A newer main commit appeared while this job was building. The new run will handle it; refusing to push stale output."
            exit 1
          fi

          git add -A -- .
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync upstream rules"
            git push origin HEAD:main
          else
            echo "No generated changes to commit."
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
